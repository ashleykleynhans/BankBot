services:
  bankbot:
    image: ghcr.io/ashleykleynhans/bankbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # direct API access for debugging; the frontend goes through nginx
    volumes:
      - ./data:/app/data
      - ./statements:/app/statements
    environment:
      # Point at an OpenAI-compatible LLM server (LM Studio / Ollama) on the host.
      BANKBOT_LLM_HOST: host.docker.internal
      BANKBOT_LLM_PORT: "1234" # LM Studio default; use 11434 for Ollama
      # Set to the model id your LLM server exposes (check /v1/models).
      BANKBOT_LLM_MODEL: "qwen3-8b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      bankbot:
        condition: service_healthy
    restart: unless-stopped
