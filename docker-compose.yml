services:
  bankbot:
    image: ghcr.io/ashleykleynhans/bankbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./statements:/app/statements
    environment:
      # Point at an OpenAI-compatible LLM server (LM Studio / Ollama) on the host.
      BANKBOT_LLM_HOST: host.docker.internal
      BANKBOT_LLM_PORT: "1234" # LM Studio default; use 11434 for Ollama
      # BANKBOT_LLM_MODEL: "qwen3:8b" # set to the model name your LLM server exposes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
