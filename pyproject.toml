[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bankbot"
version = "0.4.0"
description = "BankBot - Parse and query your bank statements with a local AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.10",
    # pymupdf 2.x hard-depends on onnxruntime, which has no Python 3.15 wheels yet
    "pymupdf>=1.28.2,<2.0",
    "pytesseract>=0.3.13",
    "pillow>=13.0.0",
    "watchdog>=6.0.0",
    "openai>=3.36.1",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
mlx = [
    # mlx-lm pulls in sentencepiece, which has no cp315 wheel yet: on Python
    # 3.15 pip builds it from source and needs cmake (brew install cmake)
    "mlx-lm>=0.32.2",
]

[project.scripts]
bankbot = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore:builtin type Swig.*:DeprecationWarning",
    "ignore:builtin type swig.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "raise NotImplementedError",
    "pass$",
]
exclude_also = [
    # Abstract methods
    "def parse\\(self.*\\) -> StatementData:",
    "def bank_name\\(cls\\) -> str:",
]
